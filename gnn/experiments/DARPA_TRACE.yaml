general:
  show_progress_bar: True

  experiment_name: "Trace"
  num_runs: 1
  num_anom_sets: 1

  mlflow_tracking_uri: "./gnn/experiments/mlflow"
  output_root: "./gnn/experiments"


data:
  dataset_root: "./create_graph/output_data/trace/"
  dataset_name: ["darpa-trace"]
  anom_type: ["organic"]
  val_ratio: 0.10 
  test_ratio: 0.70



models:

  TGN:
    node_feat_dim: 50
    edge_feat_dim: 50
    num_neighbors: 20
    sample_neighbor_strategy: "recent"
    time_feat_dim: 50
    num_layers: 1
    num_heads: 2
    dropout: 0.1

  DyGFormer:
    node_feat_dim: 50
    edge_feat_dim: 50
    sample_neighbor_strategy: "recent"
    time_feat_dim: 50
    channel_embedding_dim: 20
    patch_size: 1
    max_input_sequence_length: 32
    num_layers: 1
    num_heads: 2
    dropout: 0.1


training:
  learning_rate: [1e-4]
  num_epochs: 50
  batch_size: 200
  optimizer: "Adam"
  weight_decay: 0.0
  patience: 40
  test_interval_epochs: 10
  seed: 2024

