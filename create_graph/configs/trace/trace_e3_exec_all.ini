[dataset]
name = Trace E3 All
path = /home/buchta/sambashare/gnn_darpa_lab/parse_data/input_data/trace/
track = all
outputpath = /home/buchta/sambashare/gnn_darpa_lab/parse_data/output_data/trace/all/

[regex_expressions]
uuid    = r'uuid\":\"(.*?)\"'
src     = r'subject\":{\"com.bbn.tc.schema.avro.cdm18.UUID\":\"(.*?)\"}'
dst1    = r'predicateObject\":{\"com.bbn.tc.schema.avro.cdm18.UUID\":\"(.*?)\"}'
dst2    = r'predicateObject2\":{\"com.bbn.tc.schema.avro.cdm18.UUID\":\"(.*?)\"}'
type    = r'type\":\"(.*?)\"'
time    = r'timestampNanos\":(.*?),'
exec    = r'\"exec\":\"(.*?)\",'
path    = r'\"predicateObjectPath\":{\"string\":\"(.*?)\"'
ip      = r'\"address\":\"(.*?)\"'
port    = r'\"port\":(.*?)'
name    = r'\"name\":\"(.*?)\"'

[keep_events]
keep_events = ["EVENT_EXECUTE", "EVENT_RENAME", "EVENT_SENDTO", "EVENT_RECVFROM", "EVENT_WRITE", "EVENT_READ", "EVENT_MODIFY_FILE_ATTRIBUTES", "EVENT_RENAME", "EVENT_RECVMSG"]

[skip_execs]
skip_execs = ['']

[exclude_patterns]
host            = r'com.bbn.tc.schema.avro.cdm18.Host'
timemarker      = r'com.bbn.tc.schema.avro.cdm18.TimeMarker'
startmarker     = r'com.bbn.tc.schema.avro.cdm18.StartMarker'
unitdependency  = r'com.bbn.tc.schema.avro.cdm18.UnitDependency'
endmarker       = r'com.bbn.tc.schema.avro.cdm18.EndMarker'
memoryobject    = r'com.bbn.tc.schema.avro.cdm18.MemoryObject'
unnamedpipeobject = r'com.bbn.tc.schema.avro.cdm18.UnnamedPipeObject'

[row_types]
event           = r'com.bbn.tc.schema.avro.cdm18.Event'
netflowobject   = r'com.bbn.tc.schema.avro.cdm18.NetFlowObject'
				
[track_files]
files           = ['ta1-trace-e3-official-1.json']

[files]
gt_metas         = ["/home/buchta/sambashare/gnn_darpa_lab/parse_data/configs/trace/darpa-trace-00_gt_meta.yaml","/home/buchta/sambashare/gnn_darpa_lab/parse_data/configs/trace/darpa-trace-01_gt_meta.yaml", "/home/buchta/sambashare/gnn_darpa_lab/parse_data/configs/trace/darpa-trace-02_gt_meta.yaml", "/home/buchta/sambashare/gnn_darpa_lab/parse_data/configs/trace/darpa-trace-03_gt_meta.yaml"]
				